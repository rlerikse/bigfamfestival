name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev, 'release/**' ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-expo:
    name: Expo Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    # EAS cloud builds cost real build credits — do NOT run on every
    # push to main/dev. Only run on release branches (release/*), on a
    # release-please version tag (vX.Y.Z, see #117), or when explicitly
    # triggered manually via workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "profile=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "profile=beta" >> $GITHUB_OUTPUT
          else
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Build Android (${{ steps.profile.outputs.profile }})
        run: eas build --platform android --profile ${{ steps.profile.outputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google Play service account key
        if: steps.profile.outputs.profile == 'beta' || steps.profile.outputs.profile == 'production'
        run: |
          printf '%s' '${{ secrets.GOOGLE_PLAY_SA_KEY }}' > google-play-service-account.json
        env:
          GOOGLE_PLAY_SA_KEY: ${{ secrets.GOOGLE_PLAY_SA_KEY }}

      - name: Submit Android to Google Play (${{ steps.profile.outputs.profile }})
        if: steps.profile.outputs.profile == 'beta' || steps.profile.outputs.profile == 'production'
        run: eas submit --platform android --profile ${{ steps.profile.outputs.profile }} --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SA_KEY: ${{ secrets.GOOGLE_PLAY_SA_KEY }}

      # iOS build — requires Apple Developer certs + provisioning profiles
      # TODO(BFF-S3-xx): enable once Apple certs are configured in EAS
      # - name: Build iOS (${{ steps.profile.outputs.profile }})
      #   run: eas build --platform ios --profile ${{ steps.profile.outputs.profile }} --non-interactive
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
