name: Android Deploy — Alpha Testing

# This workflow intentionally has no push/workflow_run trigger. Store submission
# must name the exact EAS build that was approved for this commit or release tag;
# never infer it from EAS's "latest" build.
#
# To submit an approved alpha candidate:
#   1. Select the branch or tag containing the approved commit when dispatching.
#   2. Supply that full 40-character commit SHA and the EAS Android build ID.
#   3. This workflow verifies the build is a finished, non-expired, store beta
#      build created from that exact commit before it can submit to the alpha track.
#
# Production promotion remains a separate manual release decision.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact EAS Android build ID to submit (never use "latest")
        required: true
        type: string
      expected_commit:
        description: Full 40-character commit SHA represented by the selected branch/tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-alpha-deploy-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  deploy-to-alpha-testing:
    name: Validate and deploy approved Android build to alpha
    runs-on: ubuntu-latest

    steps:
      - name: Validate dispatch commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SELECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit must be a full 40-character lowercase Git SHA."
            exit 1
          fi
          if [ "$EXPECTED_COMMIT" != "$SELECTED_COMMIT" ]; then
            echo "::error::Selected ref resolves to $SELECTED_COMMIT, not requested commit $EXPECTED_COMMIT. Re-run from the approved branch or tag."
            exit 1
          fi

      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate the exact EAS build
        id: validate-build
        working-directory: mobile
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_JSON="$(eas build:view "$BUILD_ID" --json)"
          export BUILD_JSON
          python3 - <<'PY'
          import datetime
          import json
          import os
          import sys

          build = json.loads(os.environ["BUILD_JSON"])
          expected = os.environ["EXPECTED_COMMIT"]
          errors = []

          checks = {
              "id": os.environ["BUILD_ID"],
              "platform": "ANDROID",
              "status": "FINISHED",
              "distribution": "STORE",
              "buildProfile": "beta",
              "gitCommitHash": expected,
          }
          for field, wanted in checks.items():
              actual = build.get(field)
              if actual != wanted:
                  errors.append(f"{field} is {actual!r}; expected {wanted!r}")

          expires = build.get("expirationDate")
          try:
              expiry = datetime.datetime.fromisoformat(expires.replace("Z", "+00:00"))
              if expiry <= datetime.datetime.now(datetime.timezone.utc):
                  errors.append(f"expirationDate {expires!r} is expired")
          except (AttributeError, TypeError, ValueError):
              errors.append(f"expirationDate {expires!r} is missing or invalid")

          artifacts = build.get("artifacts") or {}
          if not (artifacts.get("applicationArchiveUrl") or artifacts.get("buildUrl")):
              errors.append("build has no downloadable Android archive")

          if errors:
              print("::error::Refusing Play submission: selected EAS build is not an eligible approved alpha artifact.")
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print(f"Validated EAS build {build['id']} (version {build.get('appVersion')}, code {build.get('appBuildVersion')}).")
          PY

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_SA_KEY: ${{ secrets.GOOGLE_PLAY_SA_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GOOGLE_PLAY_SA_KEY" > mobile/google-play-service-account.json

      - name: Submit exact build to Google Play alpha track
        working-directory: mobile
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform android --profile beta --id "$BUILD_ID" --non-interactive

      - name: Clean up service account key
        if: always()
        run: rm -f mobile/google-play-service-account.json

      - name: Notify success
        if: success()
        run: echo "✅ Validated build submitted to the Google Play alpha testing track."
